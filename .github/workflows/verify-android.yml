name: Verify Native Android

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'compiler-input/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  push:
    branches: [ main, feedback-fixes-no-build ]
    paths:
      - 'app/**'
      - 'compiler-input/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify resources, manifest, Room/KSP and Kotlin
        shell: bash
        run: >
          gradle
          :app:processDebugResources
          :app:processDebugMainManifest
          :app:compileDebugKotlin
          --no-daemon
          --stacktrace
