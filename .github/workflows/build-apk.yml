name: Build Kitchen Prep Board APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct approved HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cat compiler-input/html.part* > app/src/main/assets/kitchen_prep_board.html
          echo "ecb21222ee589b0578774c4c3c3d6d15a08a6d3c271163f468f204a13194a131  app/src/main/assets/kitchen_prep_board.html" | sha256sum -c -

      - name: Apply QA fixes to packaged app
        shell: bash
        run: |
          set -euo pipefail
          python compiler-input/html_qa_patch.py app/src/main/assets/kitchen_prep_board.html
          echo "c0fdb6d4d9b5f5deb62e4b45cfe98a52963b7e58fe1f02caf5f9369c2433448a  app/src/main/assets/kitchen_prep_board.html" | sha256sum -c -
          python compiler-input/native_qa_patch.py

      - name: Build canonical launcher icons
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec#*:}"
            out="app/src/main/res/mipmap-${density}"
            mkdir -p "$out"
            rsvg-convert -w "$size" -h "$size" compiler-input/KitchenPrepBoard-AppIcon-v4.svg -o "$out/ic_launcher.png"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done

      - name: Static QA checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'let createStep=1;' app/src/main/assets/kitchen_prep_board.html
          grep -q 'function seedBoards(){ return \[\]; }' app/src/main/assets/kitchen_prep_board.html
          grep -q 'AndroidBridge.getClipboardText' app/src/main/assets/kitchen_prep_board.html
          grep -q 'id="darkModeSwitch"' app/src/main/assets/kitchen_prep_board.html
          grep -q 'position:sticky;top:0;z-index:60' app/src/main/assets/kitchen_prep_board.html
          grep -q 'data-release-link="privacy"' app/src/main/assets/kitchen_prep_board.html
          grep -q 'querySelectorAll("\[data-release-link\]")' app/src/main/assets/kitchen_prep_board.html
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "app/src/main/res/mipmap-${density}/ic_launcher.png"
            test -s "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KitchenPrepBoard-ClosedTest-v2.apk
          sha256sum dist/KitchenPrepBoard-ClosedTest-v2.apk > dist/KitchenPrepBoard-ClosedTest-v2.apk.sha256
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KitchenPrepBoard-ClosedTest-APK-v2
          path: |
            dist/KitchenPrepBoard-ClosedTest-v2.apk
            dist/KitchenPrepBoard-ClosedTest-v2.apk.sha256
          if-no-files-found: error
          retention-days: 7
