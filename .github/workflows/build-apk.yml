name: Build Kitchen Prep Board APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up current Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Install Android 17 compile SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_CLI="$ANDROID_SDK_ROOT/cmdline-tools/15859902/bin/android"
          "$ANDROID_CLI" --sdk="$ANDROID_SDK_ROOT" sdk install --canary \
            platforms/android-37 \
            build-tools/36.0.0 \
            platform-tools

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KitchenPrepBoard-ClosedTest.apk
          sha256sum dist/KitchenPrepBoard-ClosedTest.apk > dist/KitchenPrepBoard-ClosedTest.apk.sha256
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KitchenPrepBoard-ClosedTest-APK
          path: |
            dist/KitchenPrepBoard-ClosedTest.apk
            dist/KitchenPrepBoard-ClosedTest.apk.sha256
          if-no-files-found: error
          retention-days: 7
